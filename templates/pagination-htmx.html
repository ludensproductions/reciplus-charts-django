{% load i18n %}
<div class="container" style="margin-top: 25px;">
    <nav class="d-lg-flex justify-content-lg-center">
        <ul class="pagination">
            {% if page_obj.has_previous %}
                <li class="page-item">
                    <a class="page-link"
                       hx-get="{{ request.path }}"
                       hx-target="#dialogModal"
                       hx-vals='{"page": "1"}'
                       hx-include="#filters"
                       hx-swap="innerHTML"
                       href="#"
                       aria-label="{% trans 'Primera' %}">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
                <li class="page-item">
                    <a class="page-link"
                       hx-get="{{ request.path }}"
                       hx-target="#dialogModal"
                       hx-vals='{"page": "{{ page_obj.previous_page_number }}"}'
                       hx-include="#filters"
                       hx-swap="innerHTML"
                       href="#"
                       aria-label="{% trans 'Anterior' %}">
                        <span aria-hidden="true">&lsaquo;</span>
                    </a>
                </li>
            {% endif %}
            <li class="page-item">
                <a class="page-link">{% trans "Página" %} {{ page_obj.number }} {% trans "de" %} {{ page_obj.paginator.num_pages }}</a>
            </li>
            {% if page_obj.has_next %}
                <li class="page-item">
                    <a class="page-link"
                       hx-get="{{ request.path }}"
                       hx-target="#dialogModal"
                       hx-vals='{"page": "{{ page_obj.next_page_number }}"}'
                       hx-include="#filters"
                       hx-swap="innerHTML"
                       href="#"
                       aria-label="{% trans 'Siguiente' %}">
                        <span aria-hidden="true">&rsaquo;</span>
                    </a>
                </li>
                <li class="page-item">
                    <a class="page-link"
                       hx-get="{{ request.path }}"
                       hx-target="#dialogModal"
                       hx-vals='{"page": "{{ page_obj.paginator.num_pages }}"}'
                       hx-include="#filters"
                       hx-swap="innerHTML"
                       href="#"
                       aria-label="{% trans 'Última' %}">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            {% endif %}
        </ul>
    </nav>
</div>
