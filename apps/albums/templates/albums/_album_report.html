{% load static utils external_static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Album Collection</title>
        <link rel="stylesheet"
              type="text/css"
              href="{% external_static_url 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css' %}">
        <link rel="stylesheet"
              type="text/css"
              href="{% external_static_url 'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css' %}">
        <link rel="stylesheet"
              type="text/css"
              href="{% static 'assets/css/albums/album_report_styles.css' %}">
    </head>
    <body>
        <div class="container my-4">
            <h1 class="mb-4 text-center">
                <i class="fas fa-record-vinyl me-2"></i>
                Album Collection
            </h1>
            <div class="row g-4">
                {% for album in albums %}
                    <div class="col-6">
                        <div class="album-card">
                            <!-- Cover placeholder -->
                            <div class="album-cover">
                                {% if album.cover %}
                                    <img src="{{ album.cover|get_file_name }}"
                                         alt="{{ album.title }}"
                                         class="img-fluid">
                                {% else %}
                                    <i class="fas fa-music"></i>
                                {% endif %}
                            </div>
                            <div class="p-3">
                                <h5 class="mb-2 mt-3">{{ album.title }}</h5>
                                <div class="album-meta text-muted small">
                                    <div>
                                        <i class="fas fa-user"></i>
                                        {{ album.artist }}
                                    </div>
                                    <div>
                                        <i class="fas fa-calendar-alt"></i>
                                        {{ album.year }}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </body>
</html>
