{% load static utils external_static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{{ album.title }}</title>
        <link rel="stylesheet"
              type="text/css"
              href="{% external_static_url 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css' %}">
        <link rel="stylesheet"
              type="text/css"
              href="{% external_static_url 'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css' %}">
        <link rel="stylesheet"
              type="text/css"
              href="{% static 'assets/css/albums/album_card_styles.css' %}">
    </head>
    <body>
        <div class="album-card">
            <!-- Album cover -->
            <div class="album-cover">
                {% if album.cover %}
                    <img src="{{ album.cover|get_file_name }}" alt="{{ album.title }}">
                {% else %}
                    <i class="fas fa-music"></i>
                {% endif %}
            </div>
            <!-- Album content -->
            <div class="album-content">
                <div class="album-header">
                    <h1>
                        <i class="fas fa-record-vinyl me-2"></i>
                        {{ album.title }}
                    </h1>
                    <div class="album-meta">
                        <i class="fas fa-user me-1"></i> {{ album.artist }}
                        &nbsp;|&nbsp;
                        <i class="fas fa-calendar-alt me-1"></i> {{ album.year }}
                    </div>
                </div>
                <div class="songs-table">
                    <table class="table table-borderless">
                        <thead>
                            <tr>
                                <th>
                                    <i class="fas fa-music me-1"></i> Song
                                </th>
                                <th class="song-duration">
                                    <i class="fas fa-clock me-1"></i> Duration
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for song in songs %}
                                <tr>
                                    <td>{{ song.title }}</td>
                                    <td class="song-duration">{{ song.duration }}</td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </body>
</html>
