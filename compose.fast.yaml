# Compose para despliegue todo en uno (usado en servidores)
## Pendientes:
## - Renombrar base de datos y redis maestro reemplazando "template" por un nombre acorde al proyecto actual

volumes:
  postgres-data:

x-django-base: &django-base
  build: .
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - .:/app

services:
  template-db:
    restart: unless-stopped
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${SQL_USER}
      POSTGRES_PASSWORD: ${SQL_PASSWORD}
      POSTGRES_DB: ${SQL_DBNAME}
      POSTGRES_HOST: ${SQL_HOST}
    ports:
      - ${SQL_PORT}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=${SQL_USER} --dbname=${SQL_DBNAME}"]
      interval: 5s
      timeout: 10s
      retries: 5

  template-redis:
    image: redis:5.0.3-alpine
    restart: unless-stopped
    ports:
      - ${REDIS_PORT}:6379

  django:
    <<: *django-base
    command: sh docker/django/start.sh
    ports:
      - ${DOCKER_PORT_OUT}:8000
    depends_on:
      template-db:
        condition: service_healthy

