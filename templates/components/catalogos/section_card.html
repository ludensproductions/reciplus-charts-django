{% comment %}
<!--
Attributes
    catalogo_url: Url to which the button will send you when you click on it.
    title: Name to be used on the card.
-->
{% endcomment %}
<div class="col-12 col-sm-12 col-md-6 col-lg-4 col-xl-3 mb-3">
    <a href="{% url catalogo_url %}" class="catalogo_link card_link" title="{{ title }}">
        <div id="card_center" class="card configuracion_pt_cards wrap-text h-100" tabindex="0">
            <div class="card-body d-flex align-items-center justify-content-center py-4">
                <h2 class="fs-4 text-center card-title m-0 py-1">
                    {{ title }}
                </h2>
            </div>
        </div>
    </a>
</div>
