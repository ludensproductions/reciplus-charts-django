## Compose para desarrollo manual (usando venv)
# Levanta base de datos y un redis, este compose solo debe estar
# en proyectos individuales, y no en proyectos que ocupen una base de datos maestra (tipo coveli, anam)

volumes:
  postgres-data:

services:
  redis:
    image: "redis:5.0.3-alpine"
    restart: unless-stopped
    ports:
      - ${REDIS_PORT}:6379

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${SQL_USER}
      POSTGRES_PASSWORD: ${SQL_PASSWORD}
      POSTGRES_DB: ${SQL_DBNAME}
      POSTGRES_HOST: ${SQL_HOST}
    ports:
      - ${SQL_PORT}:5432
    volumes:
      - "postgres-data:/var/lib/postgresql/data/"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=${SQL_USER} --dbname=${SQL_DBNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
